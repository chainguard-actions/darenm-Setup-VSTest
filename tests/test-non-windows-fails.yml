name: Test non-Windows runner fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed on non-Windows platform
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail on Linux (VSTest only works on Windows)"
            exit 1
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "FAIL: expected conclusion 'success' due to continue-on-error"
            exit 1
          fi
          echo "PASS"
