name: Test non-Windows platform fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record PATH before
        run: echo "$PATH" > /tmp/path-before.txt
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed on non-Windows runner
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on Linux (VSTest only works on Windows), got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Assert PATH was not modified with VSTest folder
        run: |
          echo "PATH: $PATH"
          if echo "$PATH" | grep -q "TestWindow"; then
            echo "FAIL: VSTest folder should not be added to PATH on Linux"
            exit 1
          fi
          if [ -n "$GITHUB_PATH" ] && [ -f "$GITHUB_PATH" ] && grep -q "TestWindow" "$GITHUB_PATH"; then
            echo "FAIL: GITHUB_PATH contains VSTest folder"
            exit 1
          fi
          echo "PASS"
      - name: Assert vstest.console is not available
        run: |
          if command -v vstest.console.exe >/dev/null 2>&1; then
            echo "FAIL: vstest.console.exe unexpectedly found"
            exit 1
          fi
          echo "PASS"
