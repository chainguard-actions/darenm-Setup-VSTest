name: Test non-Windows runner does not modify PATH
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record PATH before
        run: echo "$PATH" > "$RUNNER_TEMP/path-before.txt"
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert PATH not extended with VSTest folder
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "PATH: $PATH"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome, got '$OUTCOME'"
            exit 1
          fi
          if echo "$PATH" | grep -q 'TestWindow'; then
            echo "FAIL: VSTest TestWindow folder was added to PATH on Linux"
            exit 1
          fi
          if [ -n "${GITHUB_PATH:-}" ] && [ -f "$GITHUB_PATH" ] && grep -q 'TestWindow' "$GITHUB_PATH"; then
            echo "FAIL: GITHUB_PATH contains TestWindow entry"
            exit 1
          fi
          echo "PASS"
