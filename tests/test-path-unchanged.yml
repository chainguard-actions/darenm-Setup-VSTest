name: Test PATH is not modified on non-Windows runner
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record PATH before
        run: echo "PATH_BEFORE=$PATH" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert PATH has no VSTest folder and outcome is failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "PATH: $PATH"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome on Linux"
            exit 1
          fi
          if echo "$PATH" | grep -q "TestWindow"; then
            echo "FAIL: VSTest TestWindow folder was added to PATH"
            exit 1
          fi
          if command -v vstest.console.exe >/dev/null 2>&1; then
            echo "FAIL: vstest.console.exe unexpectedly found on PATH"
            exit 1
          fi
          if [ -n "$RUNNER_TOOL_CACHE" ] && [ -d "$RUNNER_TOOL_CACHE/vswhere" ]; then
            echo "FAIL: vswhere should not have been downloaded/cached on Linux"
            exit 1
          fi
          echo "PASS"
